<title>Posteando App Mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,100..900,0..100,0..1&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Allo 1.1.0 by Josh Puckett, SIL Open Font License 1.1, https://allo.joshpuckett.me (Latin subset) */
/*ALLO*/
/* Layout: an app shell on the same desk, at a low dose. Sidebar = where you are (org, sections, brands, helpers).
   Topbar = what you can do in this view (title, tools, the one cherry button). Colour means state, never client.
   Single light look by choice, same as the landing. */
:root{
  --cotton:#EDEBDD; --cream:#F8F6EE; --card:#FFFDF7; --noir:#1B1717; --muted:#5F5852;
  --cherry:#810100; --maroon:#630000; --azul:#27407A; --verde:#2C5B4C; --amarillo:#E8B62C;
  --blush:#F1D3CC; --butter:#F2E2A0; --lav:#CFCFEA; --sky:#BFE1E4; --sage:#CFE0C3; --tang:#D9541E; --tangbg:#F7DCCB;
  --rule:rgba(27,23,23,.11);
  --f:"Allo",ui-rounded,"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Fraunces","Iowan Old Style",Georgia,serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --line:1.5px solid var(--noir); --r:12px; --barh:44px; --toph:68px; --subh:46px;
}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--cotton);color:var(--noir);font-family:var(--f);font-size:15px;line-height:1.45;font-variation-settings:"ROND" 50;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variation-settings:"ROND" 80}
h3{font-size:.98rem;font-weight:760;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.serif{font-family:var(--serif);font-style:italic;font-weight:480;font-variation-settings:"SOFT" 100,"WONK" 1;letter-spacing:-.03em;color:var(--cherry);font-size:1.08em}
.mono{font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.86em}
.muted{color:var(--muted)}
:focus-visible{outline:2.5px solid var(--cherry);outline-offset:2px}
[hidden]{display:none!important}

/* buttons: a fixed dark slot and a face that lifts */
.btn{--br:12px;display:inline-block;padding:0;border:0;border-radius:var(--br);background:var(--noir);flex:none}
.btn>span{display:flex;align-items:center;justify-content:center;gap:.45em;padding:.46em .9em;border-radius:var(--br);border:var(--line);font-weight:720;font-size:.9rem;line-height:1.2;color:#fff;white-space:nowrap;
  background:linear-gradient(180deg,#96110f,var(--cherry));box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -2px 0 rgba(0,0,0,.22);transition:transform .13s ease-out}
.btn:hover>span{transform:translate(-1.5px,-2.5px)}
.btn:active>span{transform:none;transition-duration:.04s;box-shadow:inset 0 2px 3px rgba(0,0,0,.32)}
.btn.ghost>span{background:linear-gradient(180deg,#fff,var(--cream));color:var(--noir);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(27,23,23,.08)}
.btn.ghost:active>span{box-shadow:inset 0 2px 3px rgba(27,23,23,.18)}
.btn.xs{--br:9px}.btn.xs>span{padding:.28em .65em;font-size:.8rem}
.btn.lg{--br:16px}.btn.lg>span{padding:.75em 1.2em;font-size:1rem}
.btn.wide{display:block;width:100%}
.tool{display:inline-flex;align-items:center;gap:.4em;border:var(--line);border-radius:9px;background:var(--card);padding:.3em .65em;font-size:.84rem;font-weight:650;white-space:nowrap}
.tool:hover{background:#fff}
.tool.on{background:var(--noir);color:#fff}
.tool .x{margin-left:.15em;opacity:.7;font-weight:800}
.seg{display:inline-flex;border:var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:.3em .75em;font-size:.84rem;font-weight:650}
.seg button+button{border-left:var(--line)}
.seg button[aria-pressed="true"]{background:var(--noir);color:#fff}

/* figures */
.fig{display:inline-block;width:40px;aspect-ratio:1;flex:none;vertical-align:middle}
.fig svg{display:block;width:100%;height:100%;overflow:visible}
.fig .eye{transform-box:fill-box;transform-origin:center;transition:transform .1s ease-out}
.fig.is-blink .eye{transform:scaleY(.06);transition-duration:.05s}

/* mock bar (not part of the product) */
.mock{position:sticky;top:0;z-index:60;height:var(--barh);display:flex;align-items:center;gap:14px;background:var(--noir);color:#fff;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));overflow:hidden}
.mock .mono{color:rgba(255,255,255,.72);white-space:nowrap}
.mock .seg{border-color:rgba(255,255,255,.5);background:transparent}
.mock .seg button{color:#fff;font-size:.8rem}
.mock .seg button+button{border-left-color:rgba(255,255,255,.5)}
.mock .seg button[aria-pressed="true"]{background:var(--cream);color:var(--noir)}
.mock .hint{margin-left:auto}

/* shell */
.app{display:grid;grid-template-columns:238px minmax(0,1fr);height:calc(100dvh - var(--barh));min-height:600px}
.side{display:flex;flex-direction:column;gap:2px;border-right:var(--line);padding:12px 10px;overflow:auto;background:var(--cotton)}
.org{display:flex;align-items:center;gap:9px;padding:4px 6px 10px;font-weight:800;letter-spacing:-.02em;font-size:1.02rem;font-variation-settings:"ROND" 100}
.org .fig{width:30px}
.org small{display:block;font-family:var(--mono);font-size:.64rem;font-weight:400;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.find{display:flex;align-items:center;gap:8px;width:100%;border:var(--line);border-radius:10px;background:var(--card);padding:.42em .7em;font-size:.86rem;color:var(--muted);text-align:left;margin-bottom:10px}
.find kbd{margin-left:auto}
.find svg{width:15px;height:15px;flex:none}
kbd{font-family:var(--mono);font-size:.66rem;border:1px solid rgba(27,23,23,.35);border-bottom-width:2px;border-radius:5px;padding:0 .35em;background:var(--cream);color:var(--noir)}
.side .lbl{padding:14px 8px 4px}
.nav{display:flex;align-items:center;gap:9px;width:100%;border:1.5px solid transparent;border-radius:9px;background:none;padding:.36em .55em;font-size:.92rem;font-weight:620;text-align:left}
.nav:hover{background:rgba(27,23,23,.06)}
.nav[aria-current="true"]{background:var(--card);border-color:var(--noir);box-shadow:2px 2px 0 var(--noir)}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.nav .ct.hot{background:var(--cherry);color:#fff;border-radius:99px;padding:0 .5em}
.nav svg{width:16px;height:16px;flex:none}
.nav .fig{width:20px}
.nav.soon{opacity:.5}
.mg{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border:var(--line);border-radius:6px;background:var(--card);font-family:var(--mono);font-size:.6rem;font-weight:500;letter-spacing:0}
.av{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--noir);color:#fff;font-size:.62rem;font-weight:750}
.use{margin-top:auto;border:var(--line);border-radius:11px;background:var(--card);padding:10px 11px;display:grid;gap:7px}
.use .rw{display:flex;justify-content:space-between;align-items:baseline;font-size:.84rem;font-weight:680}
.use small{color:var(--muted);font-size:.76rem}
.acct{margin:10px -10px -12px;border-top:var(--line);padding:7px 8px}
.ubtn{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;border-radius:9px;padding:.4em .5em;text-align:left}
.ubtn:hover{background:rgba(27,23,23,.06)}
.ubtn .av{width:28px;height:28px;font-size:.74rem}
.ubtn b{display:block;font-size:.9rem;font-weight:720;line-height:1.2}
.ubtn small{display:block;font-size:.76rem;color:var(--muted)}
.ubtn .chev{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.pop.up{top:auto;bottom:calc(100% + 4px);left:8px;right:8px}
.pop hr{border:0;border-top:1px solid var(--rule);margin:5px 0}
.sc{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;border-radius:8px;padding:.26em .55em .26em 1.05em;font-size:.84rem;text-align:left;color:inherit}
.sc:hover{background:rgba(27,23,23,.06)}
.sc[aria-current="true"]{background:rgba(27,23,23,.09)}
.sc .fig{width:16px}
.sc b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc.more{color:var(--muted);font-size:.8rem;padding-left:2.55em}
.sc .dots i{width:4px;height:4px;margin-right:2px}
.dotw{display:block;flex:none;width:8px;height:8px;border-radius:50%;background:var(--cherry)}
.bdg{display:none}
.joined{display:flex;align-items:center;gap:10px;align-self:stretch;max-width:640px}
.joined::before,.joined::after{content:"";flex:1;border-top:1px solid var(--rule)}
.bub>.mono{display:flex;align-items:center;gap:5px}
.msg.me .bub>.mono{color:rgba(255,255,255,.66)}
.msg.mate .bub{background:var(--cotton)}
.msg .av{width:30px;height:30px;font-size:.78rem;margin-top:3px}
.bub.guest{background:var(--cream);border-style:dashed}
.bub.guest .back{border-top:1px solid var(--rule);padding-top:7px}
.to{display:inline-flex;align-items:center;gap:5px;flex:none;border:var(--line);border-radius:12px;background:var(--card);padding:0 .7em;font-size:.84rem;font-weight:680;white-space:nowrap}
.to .fig{width:18px}
.nav .trio{display:flex}.nav .trio .fig{width:15px;margin-left:-2px}
.scope{font-size:.88rem;padding:.34em .7em}
.side .bpw{display:block;margin-bottom:8px}
.side .scope{width:100%;background:var(--cream)}
.side .scope .tx{flex:1;display:flex;justify-content:space-between;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.side .bpop{position:fixed;left:10px;top:calc(var(--barh) + 98px)}
.org .rl{margin-left:auto;width:24px;height:24px;border-radius:7px;font-size:.8rem}
@media (min-width:761px){
  .app.rail{grid-template-columns:62px minmax(0,1fr)}
  .app.rail .side{padding-inline:8px}
  .app.rail .side .tx,.app.rail .side .ct,.app.rail .side .lbl,.app.rail .org>span,.app.rail .find kbd,.app.rail .use,.app.rail .ubtn>span:not(.av){display:none}
  .app.rail .org{flex-direction:column;padding-inline:0}.app.rail .org .rl{margin:0}
  .app.rail .nav,.app.rail .find,.app.rail .scope,.app.rail .ubtn{justify-content:center;padding-inline:0}
  .app.rail .nav{height:34px;position:relative}
  .app.rail .sc{display:none}
  .app.rail .bdg{display:block;position:absolute;top:4px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--cherry);border:1.5px solid var(--cotton)}
  .app.rail .acct{margin:auto -8px -12px;padding:7px 6px}
  .app.rail .pop.up{position:fixed;left:8px;right:auto;bottom:60px;width:220px}
}
.scope .mg{width:18px;height:18px;font-size:.52rem;border-radius:5px}
.scope .tx{display:inline-flex;gap:.4em}
.bpop{width:320px}.bpop .it{white-space:nowrap}
.bpop input,.mq{width:100%;border:var(--line);border-radius:8px;background:#fff;padding:.4em .65em;outline:0;font-size:.9rem}
.bpop .bl{max-height:300px;overflow:auto;margin:6px 0;display:grid;gap:1px}
/* inicio */
.home{padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:1280px}
.home h2{font-size:.98rem;font-weight:760;display:flex;align-items:center;gap:8px;margin-bottom:7px}
.home h2 .mono{margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.stat{padding:14px 16px 13px;border-right:1px solid var(--rule);display:grid;gap:3px}
.stat:last-child{border-right:0}
.stat b{font-size:2.7rem;font-weight:850;letter-spacing:-.045em;line-height:.95;font-variation-settings:"ROND" 100}
.stat span{font-size:.9rem;font-weight:650}
.stat small{font-size:.78rem;color:var(--muted)}
.hcols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:18px;align-items:start}
.hcol{display:grid;gap:18px;min-width:0}
.card{border:var(--line);border-radius:var(--r);background:var(--card);padding:14px}
.tlr{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.88rem;width:100%;border:0;background:none;text-align:left}
.tlr b{font-weight:660;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlr.gone{color:var(--muted)}
.bm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:5px 9px;align-items:center;padding:6px 0;font-size:.88rem;width:100%;border:0;background:none;text-align:left}
.bm .bar2{grid-column:1/4}
.bar2{display:flex;height:9px;border:var(--line);border-radius:99px;overflow:hidden;background:var(--cream)}
.bar2 i{display:block;border-right:1px solid var(--noir)}.bar2 i:last-child{border-right:0}
.ins{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.ins .fig{width:44px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.li .go{font-size:.78rem;font-weight:700;border:var(--line);border-radius:8px;padding:.1em .55em;background:var(--cream)}
.meter{height:7px;border:var(--line);border-radius:99px;background:var(--card);overflow:hidden}
.meter i{display:block;height:100%;width:68%;background:var(--noir)}
.main{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--cream);overflow:hidden}
.top{position:relative;z-index:6;display:flex;align-items:center;gap:10px 14px;height:var(--toph);flex:none;padding:0 20px;border-bottom:var(--line);background:var(--cream)}
.top h1{white-space:nowrap}
.top .crumb{display:block;margin-bottom:2px}
.top .sp{flex:1}

.view{flex:1;overflow:auto;min-height:0}
.sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--rule);min-height:var(--subh)}
.sub.fix{height:var(--subh);padding-block:0;flex-wrap:nowrap}

/* stage pills: pastels are highlighters */
.st{display:inline-flex;align-items:center;gap:.35em;border:var(--line);border-radius:99px;padding:.02em .6em;font-size:.76rem;font-weight:680;white-space:nowrap;background:var(--card)}
.st-idea{border-style:dashed;background:transparent}
.st-borrador{background:var(--butter)}.st-revision{background:var(--lav)}.st-cliente{background:var(--sky)}
.st-cambios{background:var(--blush)}.st-programado{background:var(--sage)}.st-publicado{background:var(--card)}
.st-fallo{background:var(--tangbg);border-color:var(--tang)}
.st.st-fallo{color:#8a2f08}
.nt{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--noir);flex:none}
.nt svg{width:100%;height:100%}
.nts{display:inline-flex;gap:3px}

/* thumbnails: drawn stand-ins for the client's media */
.th{position:relative;display:grid;place-items:center;flex:none;width:34px;height:34px;border:var(--line);border-radius:7px;overflow:hidden}
.th svg{width:70%;height:70%}
.th.big{width:100%;height:auto;aspect-ratio:4/5;border-radius:12px}
.th.big.reel,.th.big.historia{aspect-ratio:9/14}
.th.big svg{width:46%;height:46%}
.th .fm{position:absolute;right:6px;top:6px;background:var(--noir);color:#fff;border-radius:6px;font-family:var(--mono);font-size:.62rem;padding:1px 5px;text-transform:uppercase}

/* week */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:100%}
.day{display:flex;flex-direction:column;gap:6px;padding:10px 7px 26px;border-right:1px solid var(--rule);min-width:0}
.day:last-child{border-right:0}
.day.over{background:rgba(129,1,0,.06)}
.day.past{background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(27,23,23,.025) 7px 8px)}
.dh{display:flex;align-items:baseline;gap:7px;padding:0 3px 6px;position:relative}
.dh b{font-size:1.15rem;font-weight:800;position:relative;z-index:1}
.dh .hand+b{margin-right:7px}
.day.today{box-shadow:inset 0 0 0 2px var(--cherry);background:rgba(129,1,0,.035)}
.day.today .dh b{background:var(--cherry);color:#fff;border-radius:8px;padding:0 .42em;margin-left:-2px}
.day.today .dh .mono{color:var(--cherry);font-weight:500}
.mo .c.today{box-shadow:inset 0 0 0 2px var(--cherry);background:rgba(129,1,0,.035)}
.dh .n{margin-left:auto}
.slip{display:grid;gap:3px;width:100%;text-align:left;border:var(--line);border-radius:9px;padding:6px 8px 7px;font-size:.82rem;line-height:1.25;transition:transform .12s ease-out,box-shadow .12s ease-out,opacity .15s}
.slip:hover{transform:translate(-1px,-2px);box-shadow:2px 3px 0 var(--noir)}
.slip:active{transform:none;box-shadow:none}
.slip.dim{opacity:.22}
.slip.drag{opacity:.4;transform:rotate(-2deg)}
.slip .r1{display:flex;align-items:center;gap:3px 5px;flex-wrap:wrap}
.slip .r1 .nts{margin-left:auto}
.slip b{font-weight:680;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slip .mg{width:18px;height:18px;font-size:.52rem;border-radius:5px}
.slip.st-idea{border-style:dashed}
.slip .ok{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.slip .bad{font-size:.74rem;font-weight:700;color:#8a2f08}
.nowline{display:flex;align-items:center;gap:6px;color:var(--cherry);font-family:var(--mono);font-size:.64rem;margin:1px 0}
.nowline::after{content:"";flex:1;border-top:1.5px solid var(--cherry)}
.lg-st{border:0;background:none;padding:0;border-radius:99px;flex:none}
.lg-st[aria-pressed="false"] .st{opacity:.35}
/* month */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(112px,1fr);min-height:100%}
.mo .c{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mo .c:nth-child(7n){border-right:0}
.mo .c.out{background:rgba(27,23,23,.03)}
.mo .c>.num{align-self:flex-start;padding:0 4px}
.mo .c.today>.num{background:var(--cherry);color:#fff;border-radius:99px}
.mini{display:flex;align-items:center;gap:4px;border:1.2px solid var(--noir);border-radius:6px;padding:1px 5px;font-size:.72rem;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:left}
.mini.st-idea{border-style:dashed}
.mini span{overflow:hidden;text-overflow:ellipsis}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--rule);padding:6px 0;position:sticky;top:0;background:var(--cream);z-index:2}
.dow span{padding:0 10px}

/* table */
.tabs{display:flex;align-items:flex-end;gap:2px;height:var(--subh);flex:none;padding:0 20px;border-bottom:var(--line);overflow-x:auto;overflow-y:hidden}
.tab{border:var(--line);border-bottom:0;border-radius:9px 9px 0 0;background:transparent;padding:.34em .85em;font-size:.86rem;font-weight:650;white-space:nowrap;margin-bottom:-1.5px;opacity:.62;border-color:transparent}
.tab[aria-selected="true"]{background:var(--cream);opacity:1;border-color:var(--noir);border-bottom:1.5px solid var(--cream)}
.tab .num{color:var(--muted);margin-left:.3em}
.q{display:flex;align-items:center;gap:7px;border:var(--line);border-radius:9px;background:var(--card);padding:.3em .6em;flex:1 1 240px;max-width:400px}
.q input{border:0;background:none;outline:0;width:100%;min-width:0;font-size:.88rem}
.q svg{width:15px;height:15px;flex:none}
.popw{position:relative}
.pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:200px;border:var(--line);border-radius:11px;background:var(--card);box-shadow:3px 4px 0 var(--noir);padding:6px}
.pop label{display:flex;align-items:center;gap:8px;padding:.3em .5em;border-radius:7px;font-size:.88rem;cursor:pointer}
.pop label:hover{background:var(--cream)}
.pop input[type=checkbox]{accent-color:var(--cherry);width:15px;height:15px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.88rem}

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var norm=function(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');};

/* ---------- figures (Puntos eyes) ---------- */
function lobed(n){var h=Math.PI/n,R=36,r=R*Math.sin(h)*1.06,out=R*Math.cos(h)+r-Math.sqrt(r*r-Math.pow(R*Math.sin(h),2)),f=43.5/out;R*=f;r*=f;

var SH={
  sello:{d:lobed(8),y:49,col:'var(--cherry)'},
  globo:{d:'M28 12H72A22 22 0 0 1 94 34V50A22 22 0 0 1 72 72H55C47 78 39 86 32 92C29 94.5 25.6 93 26 89.5L28 72A22 22 0 0 1 6 50V34A22 22 0 0 1 28 12Z',y:42,col:'var(--azul)'},
  nota:{d:'M22 8H61L92 39V78A14 14 0 0 1 78 92H22A14 14 0 0 1 8 78V22A14 14 0 0 1 22 8Z',y:60,fold:'M61 8V29A10 10 0 0 0 71 39H92Z',col:'var(--amarillo)',dark:1},
  barras:{d:'M17 56H36V43A9 9 0 0 1 45 34H64V21A9 9 0 0 1 73 12H83A9 9 0 0 1 92 21V81A9 9 0 0 1 83 90H17A9 9 0 0 1 8 81V65A9 9 0 0 1 17 56Z',y:61,c:61,col:'var(--verde)'},
  domo:{d:'M5 78A45 45 0 0 1 95 78A10 10 0 0 1 85 88H15A10 10 0 0 1 5 78Z',y:59,col:'var(--noir)'}
};
function fig(shape,mood,small,cls,style){
  var s=SH[shape],W=s.dark?'#1B1717':'#FFFDF7',c=s.c||50,y=s.y,g=small?11:9,e='';
  var arc=function(x,up){return '<path d="M'+(x-6)+' '+(y+(up?3:0))+'Q'+x+' '+(y+(up?-9:6))+' '+(x+6)+' '+(y+(up?3:0))+'" fill="none" stroke="'+W+'" stroke-width="4.2" stroke-linecap="round"/>';};

}

/* ---------- invented example data ---------- */

    return;}
  if((el=c('[data-nav]'))){var list=(S.view==='posts'?rows():scoped().sort(function(a,b){return key(a)-key(b);})),ix=list.map(function(p){return p.id;}).indexOf(S.open),nx=list[(ix+(+el.dataset.nav)+list.length)%list.length];if(nx)openPost(nx.id);return;}
  if((el=c('[data-move]'))){var p2=byId(S.open);p2.s=el.dataset.move;render();toast(p2.s==='cliente'?'Enviado a '+BR[p2.b].c+' por WhatsApp.':'Movido a '+SL[p2.s].toLowerCase()+'.');return;}
  if((el=c('[data-stage]'))){return;}
  if((el=c('[data-use]'))){var cc=curChat(),last=cc.m.filter(function(m){return m.o;}).pop(),tp=cc.p&&byId(cc.p);if(tp){tp.cap=last.o[+el.dataset.use];toast('Texto puesto en “'+tp.t+'”.');}else toast('Copiado. Este chat no está ligado a un post.');return;}
  if((el=c('[data-say]'))){say(el.dataset.say);return;}
  if((el=c('[data-view]'))){var v=el.dataset.view;S.view=v;closePost();$('side').classList.remove('open');render();return;}
  if((el=c('[data-cal]'))){S.cal=el.dataset.cal;renderTop();renderCal();return;}
  if((el=c('[data-dim]'))){var s=el.dataset.dim;if(!s)S.dimStage={};else if(S.dimStage[s])delete S.dimStage[s];else S.dimStage[s]=1;renderCal();return;}
  if((el=c('[data-tab]'))){S.tab=el.dataset.tab;S.sel={};renderPosts();return;}
  if((el=c('[data-group]'))){S.group=el.dataset.group;renderPosts();return;}
  if((el=c('[data-sort]'))){var k2=el.dataset.sort;if(S.sort===k2)S.dir=-S.dir;else{S.sort=k2;S.dir=k2==='r'?-1:1;}renderPosts();return;}
  if((el=c('[data-open]'))){openPost(el.dataset.open);return;}
});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset.f){if(t.checked)S.F[t.dataset.f][t.value]=1;else delete S.F[t.dataset.f][t.value];renderPosts();}});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;renderPosts();}if(e.target.id==='palq'){PAL.q=e.target.value;PAL.i=0;renderPal();}if(e.target.id==='bq'){S.bq=e.target.value;scopeRender();}if(e.target.id==='mq'){S.mq=e.target.value;renderMarcas();}});
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='say'){say(e.target.t.value.trim());}});
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();PAL=PAL?null:{q:'',i:0};renderPal();return;}
  if(PAL){if(e.key==='Escape'){PAL=null;renderPal();}else if(e.key==='ArrowDown'){e.preventDefault();PAL.i=(PAL.i+1)%Math.max(PAL.n,1);renderPal();}else if(e.key==='ArrowUp'){e.preventDefault();PAL.i=(PAL.i-1+PAL.n)%Math.max(PAL.n,1);renderPal();}else if(e.key==='Enter'){palGo(PAL.i);}return;}
  var typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==='Escape'){if(S.bpop){S.bpop=false;S.bq='';scopeRender();}else if(S.umenu){S.umenu=false;renderSide();}else if(S.pop){S.pop=null;renderPosts();}else if(S.open)closePost();else if(typing)document.activeElement.blur();return;}
  if(e.key==='/'&&!typing&&S.view==='posts'){e.preventDefault();$('q').focus();}
});
/* drag a post to another day */
var dragId=null;
document.addEventListener('dragstart',function(e){var s=e.target.closest&&e.target.closest('[data-id]');if(!s)return;dragId=+s.dataset.id;s.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(dragId));}catch(x){}});
document.addEventListener('dragend',function(e){dragId=null;document.querySelectorAll('.over,.drag').forEach(function(x){x.classList.remove('over','drag');});});
document.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('[data-day]');if(!d||!dragId)return;e.preventDefault();document.querySelectorAll('.over').forEach(function(x){if(x!==d)x.classList.remove('over');});d.classList.add('over');});
document.addEventListener('drop',function(e){var d=e.target.closest&&e.target.closest('[data-day]');if(!d||!dragId)return;e.preventDefault();var p=byId(dragId),nd=+d.dataset.day;
  if(nd<TODAY){toast('Ese día ya pasó. Ni nosotros podemos con eso.');}else if(nd!==p.d){p.d=nd;toast('Movido al '+DOWL[nd%7]+' '+dnum(nd)+', '+p.h+'.'+(p.s==='programado'?' Sigue aprobado.':''));}
  dragId=null;renderCal();});
/* one figure blinks at a time */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)(function blink(){setTimeout(function(){var f=[].slice.call(document.querySelectorAll('.fig.live, .msg .fig, .fin .fig'));var x=f[Math.floor(Math.random()*f.length)];if(x){x.classList.add('is-blink');setTimeout(function(){x.classList.remove('is-blink');},130);}blink();},2400+Math.random()*3200);})();
window.addEventListener('resize',function(){if(S.railSet)return;var x=window.innerWidth<1100&&window.innerWidth>760;if(x!==S.rail){S.rail=x;renderSide();}});
window.__S=S;window.__open=openPost;window.__render=render;
render();
})();
</script>
