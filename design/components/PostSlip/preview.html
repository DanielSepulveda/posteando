<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><title>PostSlip</title>

<div class="pv-row" style="align-items:flex-start;gap:14px">
 <div class="pv-col" style="width:170px;gap:6px"><button class="slip stage-publicado" title="Publicado"><span class="row"><svg class="stage-mark" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.5l2.5 2.5 4.5-5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="monogram sm">DB</span><span class="num">09:00</span><span class="nets"><span class="net" role="img" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 19 19"><rect x="4.6" y="4.6" width="9.8" height="9.8" rx="3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="9.5" cy="9.5" r="2.3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="12.3" cy="6.7" r=".85" fill="#fff"/></svg></span><span class="net" role="img" aria-label="TikTok" title="TikTok"><svg viewBox="0 0 19 19"><path d="M10 4.6v6.6a2.2 2.2 0 1 1-1.7-2.1M10 4.6c.3 1.7 1.4 2.7 3 2.9" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span></span><b>Lunes de pastor 2x1</b></button><button class="slip stage-fallo" title="Falló"><span class="row"><svg class="stage-mark" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.5v4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="9.6" r=".9" fill="currentColor"/></svg><span class="monogram sm">FZ</span><span class="num">19:00</span><span class="nets"><span class="net" role="img" aria-label="TikTok" title="TikTok"><svg viewBox="0 0 19 19"><path d="M10 4.6v6.6a2.2 2.2 0 1 1-1.7-2.1M10 4.6c.3 1.7 1.4 2.7 3 2.9" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span></span><b>Reto de diciembre: día 1</b><span class="bad">! TikTok rechazó el audio</span></button></div>
 <div class="pv-col day-today" style="width:170px;gap:6px;padding:8px;border-radius:9px"><button class="slip stage-programado" title="Programado"><span class="row"><svg class="stage-mark" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 3.8V6l1.6 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="monogram sm">DB</span><span class="num">13:30</span><span class="nets"><span class="net" role="img" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 19 19"><rect x="4.6" y="4.6" width="9.8" height="9.8" rx="3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="9.5" cy="9.5" r="2.3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="12.3" cy="6.7" r=".85" fill="#fff"/></svg></span><span class="net" role="img" aria-label="TikTok" title="TikTok"><svg viewBox="0 0 19 19"><path d="M10 4.6v6.6a2.2 2.2 0 1 1-1.7-2.1M10 4.6c.3 1.7 1.4 2.7 3 2.9" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span></span><b>Detrás del trompo</b></button><button class="slip stage-cliente" title="Con el cliente"><span class="row"><svg class="stage-mark" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8M7 3l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="monogram sm">CT</span><span class="num">18:00</span><span class="nets"><span class="net" role="img" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 19 19"><rect x="4.6" y="4.6" width="9.8" height="9.8" rx="3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="9.5" cy="9.5" r="2.3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="12.3" cy="6.7" r=".85" fill="#fff"/></svg></span><span class="net" role="img" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 19 19"><path d="M12 5.2h-.9c-1 0-1.6.6-1.6 1.6v7.6M7.6 9.5h4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span></span></span><b>Promo de aguinaldo</b></button></div>
 <div class="pv-col" style="width:170px;gap:6px"><button class="slip stage-idea" title="Idea"><span class="row"><svg class="stage-mark" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4" stroke-dasharray="1.6 2.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="monogram sm">DS</span><span class="num">—</span><span class="nets"><span class="net" role="img" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 19 19"><rect x="4.6" y="4.6" width="9.8" height="9.8" rx="3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="9.5" cy="9.5" r="2.3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="12.3" cy="6.7" r=".85" fill="#fff"/></svg></span></span></span><b>¿Mitos del hilo dental?</b></button><button class="slip-mini stage-revision" title="Revisión interna"><svg class="stage-mark" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="6" r="1.4" fill="currentColor"/></svg><span class="monogram sm">FN</span><span>Ramos de diciembre</span></button><button class="slip-mini stage-programado" title="Programado"><svg class="stage-mark" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 3.8V6l1.6 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="monogram sm">CT</span><span>Nuevo tueste</span></button></div>
</div>
</body>
</html>
