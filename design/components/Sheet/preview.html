<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><title>Sheet</title>
<style>body{padding:20px}.pv-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pv-col{display:grid;gap:16px;justify-items:start}</style></head>
<body>
<div style="display:flex;justify-content:flex-end;background:var(--surface-page);border:1.5px solid var(--line);border-radius:12px;overflow:hidden">
<div class="sheet" style="height:430px">
 <div class="sheet-head"><span class="monogram lg">DB</span><div style="min-width:0;flex:1"><span class="label">Tacos Don Beto · Reel</span><h2 class="sheet-title">Detrás del trompo</h2></div><span class="stage stage-programado">Programado</span><button class="icon-btn" aria-label="Cerrar">×</button></div>
 <div class="sheet-sub"><div class="stepper" style="flex:1"><span class="step done"><i>✓</i>Borrador</span><span class="bar"></span><span class="step done"><i>✓</i>Revisión</span><span class="bar"></span><span class="step done"><i>✓</i>Cliente</span><span class="bar"></span><span class="step current" style="--step-ink:var(--stage-programado)"><i>4</i>Programado</span><span class="bar"></span><span class="step"><i>5</i>Publicado</span></div></div>
 <div class="sheet-body"><div><h3 class="heading" style="margin-bottom:8px">Texto</h3><div class="card" style="background:var(--surface-input)">Así se arma el trompo de Don Beto, capa por capa.<br>Sale a la 1:30, llega con hambre.</div></div>
 <div style="display:flex;align-items:center;gap:14px"><div style="flex:1"><h3 class="heading">Aprobación</h3><p class="muted" style="font-size:14px">Beto lo aprobó desde su link.</p></div><span class="stamp"><b>APROBADO</b><small>Beto · 26 nov · 10:42</small></span></div></div>
 <div class="sheet-foot"><span class="muted" style="font-size:13px;flex:1">Sale el martes a la 1:30 pm</span><button class="btn ghost"><span>Cambiar hora</span></button><button class="btn"><span>Publicar ahora</span></button></div>
</div></div>
</body>
</html>
