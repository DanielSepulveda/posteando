<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><title>Field</title>
<style>body{padding:20px}.pv-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pv-col{display:grid;gap:16px;justify-items:start}</style></head>
<body>
<div class="pv-col" style="grid-template-columns:minmax(0,300px) minmax(0,300px);gap:18px 24px;align-items:start">
 <label class="field">Nombre de la marca<input class="input" value="Tacos Don Beto"><span class="help">Así la verá tu equipo.</span></label>
 <label class="field">Usuario de Instagram<input class="input" aria-invalid="true" value="tacos don beto"><span class="err">! Sin espacios. Prueba con @tacosdonbeto.</span></label>
 <div class="search"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 10.5L14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><input placeholder="etapa:cliente red:tiktok" aria-label="Buscar posts"><span class="kbd">⌘K</span></div>
 <div class="pv-col" style="gap:8px"><label class="check-row"><input type="checkbox" class="check" checked> Instagram</label><label class="check-row"><input type="checkbox" class="check"> TikTok</label></div>
 <label class="field" style="grid-column:1/3;max-width:624px">Cambio que pides<textarea class="textarea" placeholder="Cuéntale a la agencia qué cambiarías."></textarea></label>
</div>
</body>
</html>
